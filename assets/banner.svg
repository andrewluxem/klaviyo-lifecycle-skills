<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">klaviyo-lifecycle-skills</title>
<desc id="d">Three panels. 1, the README's premise: Most Klaviyo skills teach an agent how to click around Klaviyo. 2, the six sections every skill must have, from tests/test_skills.py: When to use this skill, Inputs, Program blueprint, Klaviyo build mapping, QA, Measurement. 3, the CI check's real output, OK: 10 skill folders validated, which counts the template and nine skills that are still stubs: Status: Planned. This is a stub. Section bodies are TODO markers. Unofficial; Klaviyo is named only to describe the platform.</desc>
